<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="pill-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pill-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Animated Wave Lines -->
    <style>
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dash-flow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-card-1 { animation: float-slow 7s ease-in-out infinite; }
      .floating-card-2 { animation: float-reverse 9s ease-in-out infinite; }
      .glowing-wave { animation: pulse-glow 4s ease-in-out infinite; }
      .flowing-line { stroke-dasharray: 12, 8; animation: dash-flow 15s linear infinite; }
    </style>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Dynamic Animated Graph & Flow Waves (In Background Layer) -->
  <g class="glowing-wave" opacity="0.5">
    <path d="M -50 320 Q 250 180 550 280 T 1150 220 L 1250 400 L -50 400 Z" fill="url(#pill-grad-1)" opacity="0.15" />
    <path d="M -50 350 Q 350 220 750 320 T 1250 280 L 1250 400 L -50 400 Z" fill="url(#pill-grad-2)" opacity="0.2" />
  </g>

  <!-- Dynamic Floating Decorative Tech Cards (Positioned lower/side so text stays in clear foreground) -->
  <g class="floating-card-1">
    <rect x="860" y="50" width="280" height="110" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <text x="880" y="82" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📊 Multi-Tenant Cost Metrics</text>
    <rect x="880" y="98" width="160" height="10" rx="5" fill="#334155" />
    <rect x="880" y="98" width="115" height="10" rx="5" fill="#38bdf8" />
    <text x="880" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">Namespace Allocation: <tspan fill="#34d399" font-weight="bold">94.2%</tspan></text>
  </g>

  <g class="floating-card-2">
    <rect x="890" y="240" width="260" height="100" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#a855f7" stroke-width="1.5" />
    <text x="910" y="272" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚡ FinOps Cloud Optimization</text>
    <text x="910" y="300" fill="#e2e8f0" font-family="sans-serif" font-size="13">OpenCost &amp; Kubecost Unified</text>
    <text x="910" y="320" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">↓ 38% Idle Cloud Spend Saved</text>
  </g>

  <!-- Foreground Title and Subtitle Block (Ensured clear, crisp, and completely un-obscured) -->
  <!-- Header Badge Pill -->
  <rect x="70" y="55" width="290" height="34" rx="17" fill="url(#pill-grad-2)" />
  <text x="85" y="77" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">🚀 KUBERNETES &amp; CLOUD FINOPS</text>

  <!-- Main Title -->
  <text x="70" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Awesome Multi-Tenant Cost
  </text>
  <text x="70" y="198" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Profiling &amp; Allocation 💰
  </text>

  <!-- Subtitle -->
  <text x="70" y="248" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Curated SaaS Platforms, Open-Source FinOps Tools &amp; Kubernetes Cost Attribution Engine
  </text>

  <!-- Feature Pills -->
  <g transform="translate(70, 285)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="16" y="21" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">☸️ Kubernetes K8s</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="191" y="21" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="600">📈 Unit Economics</text>

    <!-- Pill 3 -->
    <rect x="350" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="366" y="21" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">💸 OpenCost &amp; FinOps</text>
  </g>
</svg>
